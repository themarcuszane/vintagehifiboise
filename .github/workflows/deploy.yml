name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check site files
        run: |
          bash -n scripts/deploy.sh
          node --check assets/site.js
          node --check tools/gear-editor.js
          python3 scripts/validate_site.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check deployment role
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -z "$ROLE_ARN" ]]; then
            echo 'Set the AWS_DEPLOY_ROLE_ARN repository variable before running this workflow.' >&2
            exit 1
          fi
      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - name: Preview upload
        run: scripts/deploy.sh --dry-run
      - name: Back up and deploy
        env:
          SITE_BACKUP_DIR: ${{ runner.temp }}/site-backups
        run: scripts/deploy.sh
      - name: Save pre-deploy site backup
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pre-deploy-site-backup
          path: ${{ runner.temp }}/site-backups
          if-no-files-found: ignore
          retention-days: 30
